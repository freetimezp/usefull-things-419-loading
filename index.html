<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./assets/css/style.css" />
        <title>Project</title>
    </head>

    <body>
        <div class="loader">
            <div class="loader-grid"></div>

            <div class="loader-top">
                <span>PROJECT / 2026</span>
                <span class="loader-status">INITIALIZING</span>
            </div>

            <div class="loader-center">
                <div class="loader-number">
                    <span id="counter">0</span>
                    <span class="percent">%</span>
                </div>

                <div class="loader-line">
                    <div class="loader-progress"></div>
                </div>

                <div class="loader-word">
                    <span>L</span>
                    <span>O</span>
                    <span>A</span>
                    <span>D</span>
                    <span>I</span>
                    <span>N</span>
                    <span>G</span>
                </div>
            </div>

            <div class="loader-bottom">
                <span>PLEASE WAIT</span>
                <span>NO LIMIT TO IDEAS</span>
            </div>

            <div class="greeting">
                <div class="greeting-small">WELCOME</div>
                <div class="greeting-title">HELLO.</div>
                <div class="greeting-line"></div>
                <div class="greeting-subtitle">LET'S CREATE SOMETHING.</div>
            </div>
        </div>

        <main class="content">
            <h1>Your content here.</h1>
        </main>

        <script src="./assets/js/main.js"></script>
    </body>
</html>
